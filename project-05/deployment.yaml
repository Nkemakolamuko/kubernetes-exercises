apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-config
spec:
  replicas: 3
  selector:
    matchLabels: 
      app: app-config
  template:
    metadata:
      labels:
        app: app-config
    spec:
      containers:
        - name: app-config
          image: nginx:alpine
          ports: 
          - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME
